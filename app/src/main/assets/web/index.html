<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1020"><title>StbLab Channel Picker</title>
  <style>
    :root{color-scheme:dark;font:16px system-ui,sans-serif;background:#0b1020;color:#f4f6fb}*{box-sizing:border-box}body{margin:0;padding:24px;max-width:900px;margin-inline:auto}h1{font-size:clamp(28px,5vw,46px);margin:.25em 0;color:#27d7a1}p{color:#aab4cf}.panel{background:#141c31;border:1px solid #273451;border-radius:18px;padding:20px;margin:18px 0}input,button{font:inherit;padding:13px 16px;border:1px solid #3c4c6a;border-radius:10px;background:#0b1020;color:#fff}input{max-width:100%}button{background:#167c68;border-color:#27d7a1;cursor:pointer}button:focus,input:focus{outline:3px solid #27d7a1;outline-offset:2px}form,.controls{display:flex;flex-wrap:wrap;gap:10px}.channel{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid #273451}.channel:last-child{border:0}.number{color:#aab4cf}.warning{color:#ffd166}.error{color:#ff8a8a}.muted{color:#aab4cf;font-size:.9rem}
  </style>
</head>
<body>
  <header><h1>StbLab</h1><p>Pick a channel to tune the paired Airtel box.</p></header>
  <section id="login" class="panel"><h2>Connect to this host</h2><p>Enter the access PIN shown on the BPL TV.</p><form id="pinForm"><input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 digit PIN" required><button>Connect</button></form><p id="message" role="status"></p></section>
  <main id="app" hidden>
    <p id="appMessage" role="status"></p>
    <section class="panel"><h2>Channels</h2><p id="health" class="warning">Checking remote connection…</p><div id="channels"></div></section>
    <section class="panel"><h2>Genres</h2><form id="genreForm"><input id="genreName" placeholder="New genre name" required><button>Create genre</button></form></section>
    <section class="panel"><h2>Add channel</h2><form id="channelForm"><input id="name" placeholder="Channel name" required><input id="genre" type="number" min="1" placeholder="Genre ID" required><input id="dummy" type="number" min="0" max="9999" placeholder="Picker number" required><input id="redirect" type="number" min="0" max="9999" placeholder="Box number" required><button>Add</button></form><p class="muted">Use a genre ID shown in the channel list.</p></section>
    <section class="panel"><h2>Remote controls</h2><div class="controls"><button data-key="HOME">Home</button><button data-key="BACK">Back</button><button data-key="UP">▲</button><button data-key="LEFT">◀</button><button data-key="CENTER">OK</button><button data-key="RIGHT">▶</button><button data-key="DOWN">▼</button><button data-key="VOLUME_DOWN">Vol −</button><button data-key="MUTE">Mute</button><button data-key="VOLUME_UP">Vol +</button><button data-key="TV">Live TV</button></div><form id="textForm"><input id="textInput" placeholder="Send text to the focused field"><button>Send text</button></form></section>
  </main>
  <script>
    const API='/api/v1'; let token=sessionStorage.getItem('stblab-token')||'';
    async function request(path,options={}){const r=await fetch(API+path,{...options,headers:{...(options.headers||{}),'X-StbLab-Token':token}});const data=await r.json().catch(()=>null);if(!r.ok)throw new Error(data?.detail||data?.title||`Request failed (${r.status})`);return data}
    async function load(){try{const genres=await request('/genres');document.querySelector('#channels').innerHTML=genres.length?genres.map(g=>`<h3>${escapeHtml(g.name)} <span class="muted">(genre ${g.id})</span></h3>${g.channels.map(c=>`<div class="channel"><span>${escapeHtml(c.name)}<br><span class="number">Picker ${c.dummyNumber} → box ${c.redirectNumber}</span></span><span><button data-number="${c.redirectNumber}" data-name="${escapeHtml(c.name)}" class="tune">Tune</button> <button data-id="${c.id}" class="favorite">${c.isFavorite?'★':'☆'}</button></span></div>`).join('')}`).join(''):'<p>No genres yet. Add a genre below.</p>';document.querySelectorAll('.favorite').forEach(b=>b.onclick=async()=>{try{await request(`/channels/${b.dataset.id}/favorite`,{method:'POST'});load()}catch(e){show(e.message)}});document.querySelectorAll('.tune').forEach(b=>b.onclick=async()=>{try{await request('/remote/tune',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({redirectNumber:+b.dataset.number,channelName:b.dataset.name})});show(`Tuning ${b.dataset.name}…`)}catch(e){show(e.message)}})}catch(e){show(e.message)}refreshHealth()}
    function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(s){const target=document.querySelector(document.querySelector('#app').hidden?'#message':'#appMessage');target.textContent=s;target.className='error'}
    document.querySelector('#pinForm').onsubmit=async e=>{e.preventDefault();try{const result=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:document.querySelector('#pin').value})});const data=await result.json();if(!result.ok)throw new Error(data.title||'Invalid PIN');token=data.token;sessionStorage.setItem('stblab-token',token);document.querySelector('#login').hidden=true;document.querySelector('#app').hidden=false;load()}catch(e){show(e.message)}};
    document.querySelector('#channelForm').onsubmit=async e=>{e.preventDefault();try{await request('/channels',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.querySelector('#name').value,genreId:+document.querySelector('#genre').value,dummyNumber:+document.querySelector('#dummy').value,redirectNumber:+document.querySelector('#redirect').value})});e.target.reset();load()}catch(e){show(e.message)}};
    document.querySelector('#genreForm').onsubmit=async e=>{e.preventDefault();try{await request('/genres',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.querySelector('#genreName').value})});e.target.reset();load()}catch(e){show(e.message)}};
    document.querySelectorAll('[data-key]').forEach(b=>b.onclick=async()=>{try{await request('/remote/key',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:b.dataset.key})})}catch(e){show(e.message)}});
    document.querySelector('#textForm').onsubmit=async e=>{e.preventDefault();try{await request('/remote/text',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:document.querySelector('#textInput').value})});document.querySelector('#textInput').value=''}catch(e){show(e.message)}};
    async function refreshHealth(){try{const h=await fetch(API+'/health').then(r=>r.json());document.querySelector('#health').textContent=h.detail||'Airtel remote connected';document.querySelector('#health').className=h.deviceConnected?'':'warning'}catch(e){document.querySelector('#health').textContent='Remote status unavailable'}}
    setInterval(refreshHealth,5000);
    if(token){document.querySelector('#login').hidden=true;document.querySelector('#app').hidden=false;load()}
  </script>
</body>
</html>
